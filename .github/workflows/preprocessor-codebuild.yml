name: Preprocessor CI Shadow Promotion

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      push_image:
        description: Build and publish Candidate image
        required: true
        default: true
        type: boolean

      trade_date:
        description: Optional Shadow evaluation date YYYY-MM-DD
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: preprocessor-production-pipeline
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  CODEBUILD_PROJECT: portfolio-interest-preprocessor-build
  ECR_REPOSITORY: portfolio-interest-preprocessor
  APP_CONTAINER: interest-preprocessor
  SHADOW_STATE_MACHINE_ARN: arn:aws:states:ap-northeast-2:309011444323:stateMachine:portfolio-paper-preprocessor-shadow-validation
  OPERATING_STATE_MACHINE_ARN: arn:aws:states:ap-northeast-2:309011444323:stateMachine:portfolio-paper-daily-step1-11-safe

jobs:
  build_candidate:
    runs-on: ubuntu-latest

    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      candidate_taskdef_arn: ${{ steps.candidate.outputs.candidate_taskdef_arn }}
      operating_taskdef_before: ${{ steps.candidate.outputs.operating_taskdef_before }}
      image_digest: ${{ steps.candidate.outputs.image_digest }}
      trade_date: ${{ steps.context.outputs.trade_date }}
      shadow_run_id: ${{ steps.context.outputs.shadow_run_id }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_CODEBUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve pipeline mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            PUBLISH="true"
          else
            PUBLISH="${{ inputs.push_image }}"
          fi

          echo "publish=${PUBLISH}" >> "${GITHUB_OUTPUT}"
          echo "PUBLISH=${PUBLISH}"

      - name: Start Preprocessor CodeBuild
        id: codebuild
        shell: bash
        env:
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          set -euo pipefail

          BUILD_ID="$(
            aws codebuild start-build \
              --project-name "${CODEBUILD_PROJECT}" \
              --source-version "${GITHUB_SHA}" \
              --environment-variables-override \
                name=PUSH_IMAGE,value="${PUBLISH}",type=PLAINTEXT \
              --query "build.id" \
              --output text
          )"

          echo "BUILD_ID=${BUILD_ID}"
          echo "SOURCE_SHA=${GITHUB_SHA}"
          echo "PUSH_IMAGE=${PUBLISH}"

          while true; do
            STATUS="$(
              aws codebuild batch-get-builds \
                --ids "${BUILD_ID}" \
                --query "builds[0].buildStatus" \
                --output text
            )"

            echo "BUILD_STATUS=${STATUS}"

            case "${STATUS}" in
              SUCCEEDED)
                echo "PREPROCESSOR_CODEBUILD=SUCCESS"
                break
                ;;
              FAILED|FAULT|STOPPED|TIMED_OUT)
                echo "PREPROCESSOR_CODEBUILD=FAILED"
                exit 1
                ;;
            esac

            sleep 15
          done

      - name: Resolve Shadow evaluation context
        if: steps.mode.outputs.publish == 'true'
        id: context
        shell: bash
        env:
          REQUESTED_TRADE_DATE: ${{ inputs.trade_date }}
        run: |
          set -euo pipefail

          TRADE_DATE="${REQUESTED_TRADE_DATE:-}"

          if [[ -z "${TRADE_DATE}" ]]; then
            TRADE_DATE="$(
              python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          d = datetime.now(ZoneInfo("Asia/Seoul")).date() - timedelta(days=1)

          while d.weekday() >= 5:
              d -= timedelta(days=1)

          print(d.isoformat())
          PY
            )"
          fi

          SHORT_SHA="${GITHUB_SHA:0:12}"
          SHADOW_RUN_ID="pre-shadow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SHORT_SHA}"

          echo "trade_date=${TRADE_DATE}" >> "${GITHUB_OUTPUT}"
          echo "shadow_run_id=${SHADOW_RUN_ID}" >> "${GITHUB_OUTPUT}"

          echo "TRADE_DATE=${TRADE_DATE}"
          echo "SHADOW_RUN_ID=${SHADOW_RUN_ID}"

      - name: Register digest-pinned Candidate Task Definition
        if: steps.mode.outputs.publish == 'true'
        id: candidate
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA:0:12}"

          IMAGE_DIGEST="$(
            aws ecr describe-images \
              --repository-name "${ECR_REPOSITORY}" \
              --image-ids imageTag="${SHORT_SHA}" \
              --query "imageDetails[0].imageDigest" \
              --output text
          )"

          if [[ -z "${IMAGE_DIGEST}" || "${IMAGE_DIGEST}" == "None" ]]; then
            echo "IMAGE_DIGEST_NOT_FOUND"
            exit 1
          fi

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          DIGEST_IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${IMAGE_DIGEST}"

          aws stepfunctions describe-state-machine \
            --state-machine-arn "${OPERATING_STATE_MACHINE_ARN}" \
            --query definition \
            --output text > operating-definition.json

          OPERATING_TASKDEF="$(
            python - <<'PY'
          import json

          with open("operating-definition.json", encoding="utf-8") as f:
              definition = json.load(f)

          print(
              definition["States"]["Step3_RunPreprocessor"]
              ["Parameters"]["TaskDefinition"]
          )
          PY
          )"

          echo "OPERATING_TASKDEF_BEFORE=${OPERATING_TASKDEF}"

          aws ecs describe-task-definition \
            --task-definition "${OPERATING_TASKDEF}" \
            --query taskDefinition \
            --output json > operating-taskdef.json

          jq \
            --arg image "${DIGEST_IMAGE}" \
            --arg container "${APP_CONTAINER}" \
            '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            |
            .containerDefinitions |= map(
              if .name == $container
              then .image = $image
              else .
              end
            )
            ' \
            operating-taskdef.json \
            > candidate-taskdef.json

          CANDIDATE_TASKDEF_ARN="$(
            aws ecs register-task-definition \
              --cli-input-json file://candidate-taskdef.json \
              --query "taskDefinition.taskDefinitionArn" \
              --output text
          )"

          if [[ -z "${CANDIDATE_TASKDEF_ARN}" || "${CANDIDATE_TASKDEF_ARN}" == "None" ]]; then
            echo "CANDIDATE_TASKDEF_REGISTER_FAILED"
            exit 1
          fi

          echo "CANDIDATE_TASKDEF_ARN=${CANDIDATE_TASKDEF_ARN}"
          echo "IMAGE_DIGEST=${IMAGE_DIGEST}"

          echo "candidate_taskdef_arn=${CANDIDATE_TASKDEF_ARN}" >> "${GITHUB_OUTPUT}"
          echo "operating_taskdef_before=${OPERATING_TASKDEF}" >> "${GITHUB_OUTPUT}"
          echo "image_digest=${IMAGE_DIGEST}" >> "${GITHUB_OUTPUT}"

  shadow_validation:
    needs:
      - build_candidate

    if: needs.build_candidate.outputs.publish == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_CODEBUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute Candidate Data Shadow
        shell: bash
        env:
          CANDIDATE_TASKDEF_ARN: ${{ needs.build_candidate.outputs.candidate_taskdef_arn }}
          TRADE_DATE: ${{ needs.build_candidate.outputs.trade_date }}
          SHADOW_RUN_ID: ${{ needs.build_candidate.outputs.shadow_run_id }}
        run: |
          set -euo pipefail

          jq -n \
            --arg shadow_run_id "${SHADOW_RUN_ID}" \
            --arg trade_date "${TRADE_DATE}" \
            --arg candidate_taskdef_arn "${CANDIDATE_TASKDEF_ARN}" \
            '{
              shadow_run_id: $shadow_run_id,
              trade_date: $trade_date,
              candidate_taskdef_arn: $candidate_taskdef_arn
            }' > shadow-input.json

          EXECUTION_NAME="shadow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          EXECUTION_ARN="$(
            aws stepfunctions start-execution \
              --state-machine-arn "${SHADOW_STATE_MACHINE_ARN}" \
              --name "${EXECUTION_NAME}" \
              --input file://shadow-input.json \
              --query executionArn \
              --output text
          )"

          echo "SHADOW_EXECUTION_ARN=${EXECUTION_ARN}"

          while true; do
            STATUS="$(
              aws stepfunctions describe-execution \
                --execution-arn "${EXECUTION_ARN}" \
                --query status \
                --output text
            )"

            echo "SHADOW_STATUS=${STATUS}"

            case "${STATUS}" in
              SUCCEEDED)
                echo "PREPROCESSOR_SHADOW_VALIDATION=SUCCESS"
                break
                ;;
              FAILED|TIMED_OUT|ABORTED)
                echo "PREPROCESSOR_SHADOW_VALIDATION=FAILED"

                aws stepfunctions get-execution-history \
                  --execution-arn "${EXECUTION_ARN}" \
                  --reverse-order \
                  --max-results 30 \
                  --output json || true

                exit 1
                ;;
            esac

            sleep 15
          done

  promote:
    needs:
      - build_candidate
      - shadow_validation

    if: needs.shadow_validation.result == 'success'

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_CODEBUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Promote exact Shadow-tested Candidate
        shell: bash
        env:
          CANDIDATE_TASKDEF_ARN: ${{ needs.build_candidate.outputs.candidate_taskdef_arn }}
          OPERATING_TASKDEF_BEFORE: ${{ needs.build_candidate.outputs.operating_taskdef_before }}
          IMAGE_DIGEST: ${{ needs.build_candidate.outputs.image_digest }}
        run: |
          set -euo pipefail

          echo "CANDIDATE_TASKDEF_ARN=${CANDIDATE_TASKDEF_ARN}"
          echo "TESTED_IMAGE_DIGEST=${IMAGE_DIGEST}"

          aws stepfunctions describe-state-machine \
            --state-machine-arn "${OPERATING_STATE_MACHINE_ARN}" \
            --query definition \
            --output text > operating-live.json

          LIVE_TASKDEF="$(
            python - <<'PY'
          import json

          with open("operating-live.json", encoding="utf-8") as f:
              definition = json.load(f)

          print(
              definition["States"]["Step3_RunPreprocessor"]
              ["Parameters"]["TaskDefinition"]
          )
          PY
          )"

          echo "LIVE_TASKDEF_BEFORE=${LIVE_TASKDEF}"
          echo "EXPECTED_TASKDEF_BEFORE=${OPERATING_TASKDEF_BEFORE}"

          if [[ "${LIVE_TASKDEF}" != "${OPERATING_TASKDEF_BEFORE}" ]]; then
            echo "OPERATING_TASKDEF_CHANGED_DURING_APPROVAL"
            exit 1
          fi

          python - <<'PY'
          import json
          import os

          with open("operating-live.json", encoding="utf-8") as f:
              definition = json.load(f)

          definition["States"]["Step3_RunPreprocessor"][
              "Parameters"
          ]["TaskDefinition"] = os.environ["CANDIDATE_TASKDEF_ARN"]

          with open(
              "operating-promoted.json",
              "w",
              encoding="utf-8",
          ) as f:
              json.dump(
                  definition,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":"),
              )
          PY

          aws stepfunctions update-state-machine \
            --state-machine-arn "${OPERATING_STATE_MACHINE_ARN}" \
            --definition file://operating-promoted.json \
            > promotion-result.json

          PROMOTED_TASKDEF="$(
            aws stepfunctions describe-state-machine \
              --state-machine-arn "${OPERATING_STATE_MACHINE_ARN}" \
              --query definition \
              --output text |
            python -c '
          import json,sys
          d=json.load(sys.stdin)
          print(d["States"]["Step3_RunPreprocessor"]["Parameters"]["TaskDefinition"])
          '
          )"

          echo "PROMOTED_TASKDEF=${PROMOTED_TASKDEF}"

          if [[ "${PROMOTED_TASKDEF}" != "${CANDIDATE_TASKDEF_ARN}" ]]; then
            echo "PROMOTION_VERIFY_FAILED"
            exit 1
          fi

          echo "REBUILD_AFTER_APPROVAL=NO"
          echo "REREGISTER_AFTER_APPROVAL=NO"
          echo "TESTED_ARTIFACT_EQUALS_PROMOTED_ARTIFACT=PASS"
          echo "PREPROCESSOR_PRODUCTION_PROMOTION=SUCCESS"

      - name: Publish promotion summary
        shell: bash
        env:
          CANDIDATE_TASKDEF_ARN: ${{ needs.build_candidate.outputs.candidate_taskdef_arn }}
          TRADE_DATE: ${{ needs.build_candidate.outputs.trade_date }}
          SHADOW_RUN_ID: ${{ needs.build_candidate.outputs.shadow_run_id }}
        run: |
          {
            echo "## Preprocessor Production Promotion"
            echo
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Candidate TaskDef: \`${CANDIDATE_TASKDEF_ARN}\`"
            echo "- Shadow Run ID: \`${SHADOW_RUN_ID}\`"
            echo "- Shadow Trade Date: \`${TRADE_DATE}\`"
            echo "- Approval Environment: \`production\`"
            echo "- Rebuild after approval: \`NO\`"
            echo "- Promotion: \`SUCCESS\`"
          } >> "${GITHUB_STEP_SUMMARY}"